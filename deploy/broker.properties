# Example broker config for running outside Docker:
#   epochlog-broker deploy/broker.properties broker.id=1 port=9092
broker.id=1
port=9092
advertised.host=localhost
data.dir=data/broker-1
controller=localhost:9090
min.insync.replicas=2
group.commit.enabled=true
group.commit.max.wait.us=2000
log.segment.bytes=1g
log.retention.ms=168h
